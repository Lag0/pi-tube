name: Publish to npm

# Publishes only what a GitHub release names: create a release (or a prerelease) whose tag is
# `v<package.json version>`. A semver prerelease (`3.0.0-next.1`, `-rc.1`, `-beta.1`) goes to the
# `next` dist-tag; a plain version goes to `latest`. Merging to main never publishes.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Upgrade npm (OIDC requirement)
        run: npm install -g npm@^11.5.1

      - name: Show npm version
        run: npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Verify fixtures
        run: bun run verify:fixtures

      - name: Check version and publish tag
        id: check-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          # tag-guard:start (this block and dist-tag are read by test/architecture/workflows.test.ts)
          # A release must name the version it publishes.
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version v$VERSION." >&2
            exit 1
          fi
          # tag-guard:end

          # dist-tag:start
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          # dist-tag:end
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

          if npm view ${PACKAGE_NAME}@${VERSION} version > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --provenance --access public --tag ${{ steps.check-version.outputs.tag }}
